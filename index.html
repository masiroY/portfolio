<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真白よぞら | Portfolio</title>

  <!-- リンク共有時のカード設定（OGP） -->

  <meta property="og:title" content="真白よぞら | Portfolio">
  <meta property="og:description" content="シナリオライター・真白よぞらのポートフォリオサイトです。音声作品・ASMR・各種メディア向けシナリオの執筆実績やご依頼案内を掲載しています。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://masiroy.github.io/portfolio/">
  <meta property="og:site_name" content="真白よぞら Portfolio">
  <meta name="twitter:card" content="summary">

  <style>
    :root {
      /* ギャルゲー・美少女ノベル風カラーパレット */
      --bg-base: #fcf8fa;
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(240, 190, 215, 0.6);
      --accent: #ff659c;
      --accent-sub: #8470ff;
      --accent-gradient: linear-gradient(135deg, #ff7ba8 0%, #a48eff 100%);
      --text: #2f2734;
      --text-sub: #78697f;
      --border-color: rgba(230, 200, 220, 0.6);
      --window-shadow: 0 10px 30px rgba(180, 140, 170, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.75;
      min-height: 100vh;
      background: 
        radial-gradient(circle at 10% 20%, rgba(255, 215, 230, 0.6) 0%, transparent 40%),
        radial-gradient(circle at 90% 15%, rgba(220, 215, 255, 0.55) 0%, transparent 45%),
        radial-gradient(circle at 50% 60%, rgba(255, 235, 245, 0.5) 0%, transparent 60%),
        linear-gradient(180deg, #fff7fa 0%, #f7f1f9 50%, #f4effa 100%);
      background-attachment: fixed;
    }

    /* 18禁年齢確認モーダル */
    .age-gate-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(45, 30, 48, 0.7);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .age-gate-overlay.is-passed {
      display: none;
    }
    .age-gate-box {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid var(--accent);
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(70, 30, 60, 0.25);
    }
    .age-gate-badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      padding: 4px 16px;
      border-radius: 99px;
      margin-bottom: 16px;
      letter-spacing: 0.08em;
    }
    .age-gate-title {
      font-size: 1.45rem;
      margin-bottom: 14px;
      color: #4a2d4b;
      font-weight: 700;
    }
    .age-gate-text {
      font-size: 0.92rem;
      color: #6a576f;
      line-height: 1.75;
      margin-bottom: 28px;
    }
    .age-gate-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-age-yes {
      background: var(--accent-gradient);
      color: #fff;
      padding: 12px 34px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 101, 156, 0.4);
      transition: all 0.2s;
    }
    .btn-age-yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 101, 156, 0.55);
    }
    .btn-age-no {
      background: #f0e6ed;
      border: 1px solid #dcc5d5;
      color: #79667e;
      padding: 12px 26px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s;
    }
    .btn-age-no:hover {
      background: #e4d7e1;
      color: #3b2840;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* メッセージウィンドウ風ヘッダー */
    header {
      padding: 70px 0 50px;
    }
    .header-window {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 44px 38px;
      box-shadow: var(--window-shadow);
      backdrop-filter: blur(14px);
      position: relative;
    }
    .header-window::before {
      content: "STATUS : ACTIVE";
      position: absolute;
      top: 18px;
      right: 28px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--accent-sub);
      font-weight: 700;
      opacity: 0.7;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ff3377;
      background: rgba(255, 51, 119, 0.08);
      border: 1px solid rgba(255, 51, 119, 0.28);
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 12px;
    }
    .author-title {
      font-size: 0.88rem;
      color: var(--accent-sub);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 2.7rem;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
      color: #3d2345;
      text-shadow: 0 2px 10px rgba(255, 120, 170, 0.15);
    }
    .lead {
      color: var(--text-sub);
      font-size: 1.02rem;
      max-width: 760px;
      margin-bottom: 28px;
      line-height: 1.9;
    }
    .lead strong {
      color: var(--accent);
      font-weight: 700;
    }
    .header-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 26px;
      border-radius: 99px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.22s;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 101, 156, 0.35);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(255, 101, 156, 0.5);
    }
    .btn-secondary {
      border: 1px solid var(--border-color);
      color: #55445e;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(120, 90, 130, 0.08);
    }
    .btn-secondary:hover {
      background: #faf4f8;
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    section {
      padding: 60px 0;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 26px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .section-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .section-sub {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
    }
    h2 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #3b2844;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .count-badge {
      color: var(--text-sub);
      font-size: 0.88rem;
      font-weight: 600;
    }

    /* 見出し横のトグルボタン */
    .
